<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />

    <title>Inbox</title>

    <link rel="stylesheet" href="./styles/main.css" />

    <script>
      (function () {
        let savedTheme = "light";
        try {
          savedTheme = localStorage.getItem("theme") || "light";
        } catch (error) {
          savedTheme = "light";
        }
        document.documentElement.setAttribute("data-theme", savedTheme);
      })();
    </script>
    <script type="module" src="./src/main.js"></script>
  </head>
  <body class="l-app">
    <aside class="l-sidebar" id="js-sidebar-anchor"></aside>
    <header class="l-header" id="js-header-anchor"></header>
    <main class="l-content" id="js-content-anchor">
      <div class="inbox-wrapper l-content-spacer">
        <header class="inbox-header">
          <h1 class="heading-l">Stay on top of your incoming work</h1>
        </header>

        <section class="inbox-filter" aria-label="Task status filter">
          <button class="inbox-filter__btn is-active" data-status="all" type="button">All</button>
          <button class="inbox-filter__btn" data-status="up next" type="button">Up Next</button>
          <button class="inbox-filter__btn" data-status="in progress" type="button">In Progress</button>
          <button class="inbox-filter__btn" data-status="review" type="button">Review</button>
          <button class="inbox-filter__btn" data-status="done" type="button">Done</button>
        </section>

        <section class="inbox-list" id="js-inbox-list" aria-live="polite"></section>

        <section class="inbox-empty is-hidden" id="js-inbox-empty">
          <p class="color-medium-grey">All caught up!</p>
        </section>
      </div>
    </main>
  </body>
</html>
