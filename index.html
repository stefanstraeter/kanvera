<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />

    <title>Kanvera</title>

    <link rel="stylesheet" href="./styles/main.css" />

    <script>
      (function () {
        const savedTheme = localStorage.getItem("theme") || "light";
        document.documentElement.setAttribute("data-theme", savedTheme);
      })();
    </script>

    <script type="module" src="./src/main.js"></script>
  </head>

  <body class="access-viewport">
    <header class="access-header">
      <div class="access-header__left">
        <a href="index.html" class="access-logo-link">
          <picture>
            <source srcset="assets/icons/logo-mobile.svg" media="(max-width: 768px)" />
            <img src="assets/icons/logo-dark.svg" alt="Kanvera Logo" class="access-logo" id="headerLogo" />
          </picture>
        </a>
      </div>

      <div class="access-header__right">
        <div class="access-nav-group">
          <div class="access-cta-group">
            <p class="access-nav-text hide-mobile">New to kanvera?</p>
            <button id="toSignupBtn" class="btn btn--secondary btn--s u-min-w-8">Sign Up</button>
          </div>

          <div class="theme-switch hide-mobile">
            <img src="assets/icons/icon-light-theme.svg" alt="Light Theme" class="theme-switch__icon" />
            <label class="switch">
              <input type="checkbox" id="theme-toggle" />
              <span class="slider"></span>
            </label>
            <img src="assets/icons/icon-dark-theme.svg" alt="Dark Theme" class="theme-switch__icon" />
          </div>

          <div class="menu-dropdown menu-dropdown--mobile-only">
            <button class="menu-dropdown__trigger" id="js-menu-trigger" aria-label="Menu">
              <img src="assets/icons/icon-vertical-ellipsis.svg" alt="More" class="access-icon" />
            </button>

            <div class="menu-dropdown__content" id="js-menu-content">
              <div class="menu-dropdown__group">
                <span class="menu-dropdown__label heading-xs">Legal</span>
                <a href="privacy.html" class="menu-dropdown__link">Privacy Policy</a>
                <a href="legal.html" class="menu-dropdown__link">Legal Notice</a>
              </div>

              <div class="menu-dropdown__theme-toggle">
                <hr class="menu-dropdown__divider" />
                <span class="menu-dropdown__label heading-xs">Appearance</span>
                <div class="theme-switch theme-switch--dropdown">
                  <img src="assets/icons/icon-light-theme.svg" alt="Light Theme" class="theme-switch__icon" />
                  <label class="switch">
                    <input type="checkbox" id="theme-toggle-dropdown" />
                    <span class="slider"></span>
                  </label>
                  <img src="assets/icons/icon-dark-theme.svg" alt="Dark Theme" class="theme-switch__icon" />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main class="access-main">
      <section class="gateway">
        <div class="gateway__stage" id="gatewaySlider">
          <div class="view-wrapper" id="loginWrapper">
            <form class="gateway__form" id="loginForm">
              <div class="gateway__header">
                <h2 class="gateway__title heading-2xl">Hey there!</h2>
              </div>

              <div class="field-wrapper">
                <div class="field-group">
                  <input type="email" id="loginEmail" class="field-input" placeholder="Email" />
                  <i class="fa-regular fa-envelope field-icon"></i>
                </div>
                <div class="error-msg">Email is required</div>
              </div>

              <div class="field-wrapper">
                <div class="field-group">
                  <input type="password" id="loginPassword" class="field-input" placeholder="Password" />
                  <i class="fa-solid fa-lock field-icon"></i>
                </div>
                <div class="error-msg">Password is required</div>
              </div>

              <div class="gateway__actions">
                <button type="submit" class="btn btn--s btn--primary btn--full">Sign In</button>
                <button type="button" class="btn btn--s btn--secondary btn--full">Guest Sign In</button>
              </div>
            </form>
          </div>
          <div class="view-wrapper" id="signupWrapper">
            <form class="gateway__form" id="signupForm">
              <div class="gateway__header">
                <i class="fa-solid fa-arrow-left gateway__back" id="toLoginArrow"></i>
                <h2 class="gateway__title heading-2xl">Get on board!</h2>
              </div>

              <div class="field-wrapper">
                <div class="field-group">
                  <input type="text" id="signupName" class="field-input" placeholder="Name" />
                  <i class="fa-regular fa-user field-icon"></i>
                </div>
                <div class="error-msg">Name is required</div>
              </div>

              <div class="field-wrapper">
                <div class="field-group">
                  <input type="email" id="signupEmail" class="field-input" placeholder="Email" />
                  <i class="fa-regular fa-envelope field-icon"></i>
                </div>
                <div class="error-msg">Email is required</div>
              </div>

              <div class="field-wrapper">
                <div class="field-group">
                  <input type="password" id="signupPassword" class="field-input" placeholder="Password" />
                  <i class="fa-solid fa-lock field-icon"></i>
                </div>
                <div class="error-msg">Password is required</div>
              </div>

              <div class="field-wrapper">
                <div class="field-group">
                  <input type="password" id="signupConfirmPassword" class="field-input" placeholder="Confirm Password" />
                  <i class="fa-solid fa-lock field-icon"></i>
                </div>
                <div class="error-msg">Passwords do not match</div>
              </div>

              <div class="policy-check">
                <input type="checkbox" id="policy" required />
                <label for="policy">I accept the <a href="privacy.html" class="link" target="_blank">Privacy Policy</a></label>
              </div>

              <div class="gateway__actions">
                <button type="submit" class="btn btn--s btn--primary btn--full">Sign Up</button>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
