<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />

    <title>Kanvera</title>

    <link rel="stylesheet" href="./styles/main.css" />

    <script>
      (function () {
        const savedTheme = localStorage.getItem("theme") || "light";
        document.documentElement.setAttribute("data-theme", savedTheme);
      })();
    </script>

    <script type="module" src="./src/main.js"></script>
  </head>

  <body class="auth-viewport">
    <div id="splashScreen" class="splash-screen">
      <img id="splashScreenLogo" class="splash-screen__logo" src="assets/icons/logo-light.svg" alt="Kanvera Logo" />
    </div>

    <header class="auth-header">
      <div class="auth-header__left">
        <a href="index.html" class="auth-logo-link">
          <picture>
            <source srcset="assets/icons/logo-mobile.svg" media="(max-width: 768px)" />
            <img src="" class="header__logo-img" id="headerLogoFinal" alt="Kanvera Logo" />
          </picture>
        </a>
      </div>

      <div class="auth-header__right">
        <div class="auth-nav-group">
          <div class="auth-cta-group">
            <p class="auth-nav-text hide-mobile">New to kanvera?</p>
            <button id="toSignUpBtn" class="btn btn--secondary btn--s u-min-w-8">Sign Up</button>
          </div>

          <div class="theme-switch hide-mobile">
            <img src="assets/icons/icon-light-theme.svg" alt="Light Theme" class="theme-switch__icon" />
            <label class="switch">
              <input type="checkbox" id="theme-toggle" />
              <span class="slider"></span>
            </label>
            <img src="assets/icons/icon-dark-theme.svg" alt="Dark Theme" class="theme-switch__icon" />
          </div>

          <div class="menu-dropdown menu-dropdown--mobile-only">
            <button class="menu-dropdown__trigger" id="js-menu-trigger" aria-label="Menu">
              <img src="assets/icons/icon-vertical-ellipsis.svg" alt="More" class="auth-icon" />
            </button>

            <div class="menu-dropdown__content" id="js-menu-content">
              <div class="menu-dropdown__group">
                <span class="menu-dropdown__label heading-xs">Legal</span>
                <a href="privacy.html" class="menu-dropdown__link">Privacy Policy</a>
                <a href="legal.html" class="menu-dropdown__link">Legal Notice</a>
              </div>

              <div class="menu-dropdown__theme-toggle">
                <hr class="menu-dropdown__divider" />
                <span class="menu-dropdown__label heading-xs">Appearance</span>
                <div class="theme-switch theme-switch--dropdown">
                  <img src="assets/icons/icon-light-theme.svg" alt="Light Theme" class="theme-switch__icon" />
                  <label class="switch">
                    <input type="checkbox" id="theme-toggle-dropdown" />
                    <span class="slider"></span>
                  </label>
                  <img src="assets/icons/icon-dark-theme.svg" alt="Dark Theme" class="theme-switch__icon" />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main class="auth-main">
      <section class="auth-flow">
        <div class="auth-flow__stage" id="authFlowStage">
          <div class="auth-flow__wrapper" id="signInWrapper">
            <form class="auth-flow__form" id="signInForm" novalidate>
              <div class="auth-flow__header">
                <h2 class="auth-flow__title heading-2xl">Hey there!</h2>
              </div>

              <div class="field-wrapper">
                <div class="field-group">
                  <input type="email" id="signInEmail" class="field-input" placeholder="Email" />
                  <i class="fa-regular fa-envelope field-icon"></i>
                </div>
                <div class="error-msg"></div>
              </div>

              <div class="field-wrapper">
                <div class="field-group">
                  <input type="password" id="signInPassword" class="field-input" placeholder="Password" />
                  <i class="fa-solid fa-eye-slash field-icon"></i>
                </div>
                <div class="error-msg"></div>
              </div>

              <div class="auth-flow__actions">
                <button type="submit" class="btn btn--s btn--primary btn--full">Sign In</button>
                <button type="button" id="guestSignInBtn" class="btn btn--s btn--secondary btn--full">Guest Sign In</button>
              </div>
            </form>
          </div>
          <div class="auth-flow__wrapper" id="signUpWrapper">
            <form class="auth-flow__form" id="signUpForm" novalidate>
              <div class="auth-flow__header">
                <i class="fa-solid fa-arrow-left auth-flow__back" id="toSignInArrow"></i>
                <h2 class="auth-flow__title heading-2xl">Get on board!</h2>
              </div>

              <div class="field-wrapper">
                <div class="field-group">
                  <input type="text" id="signUpName" class="field-input" placeholder="Name" />
                  <i class="fa-regular fa-user field-icon"></i>
                </div>
                <div class="error-msg"></div>
              </div>

              <div class="field-wrapper">
                <div class="field-group">
                  <input type="email" id="signUpEmail" class="field-input" placeholder="Email" />
                  <i class="fa-regular fa-envelope field-icon"></i>
                </div>
                <div class="error-msg"></div>
              </div>

              <div class="field-wrapper">
                <div class="field-group">
                  <input type="password" id="signUpPassword" class="field-input" placeholder="Password" />
                  <i class="fa-solid fa-eye-slash field-icon"></i>
                </div>
                <div class="error-msg"></div>
              </div>

              <div class="field-wrapper">
                <div class="field-group">
                  <input type="password" id="signUpConfirmPassword" class="field-input" placeholder="Confirm Password" />
                  <i class="fa-solid fa-eye-slash field-icon"></i>
                </div>
                <div class="error-msg"></div>
              </div>

              <div class="field-wrapper privacy-wrapper">
                <div class="checkbox-group">
                  <input type="checkbox" id="policy" class="policy-input" name="policy" hidden />

                  <label for="policy" class="policy-label">
                    <i class="fa-regular fa-square icon-unchecked"></i>
                    <i class="fa-solid fa-square-check icon-checked"></i>
                    <span class="policy-text"> I accept the <a href="privacy.html" target="_blank" class="link">Privacy Policy</a> </span>
                  </label>
                </div>
                <div class="error-msg txt-center"></div>
              </div>

              <div class="auth-flow__actions">
                <button type="submit" class="btn btn--s btn--primary btn--full">Sign Up</button>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>

    <div id="authSuccessOverlay" class="auth-feedback">
      <div class="auth-feedback__card">
        <div class="auth-feedback__content">
          <i class="fa-solid fa-circle-check auth-feedback__icon"></i>
          <h2>Signup successful!</h2>
          <p>You have been registered. Redirecting to sign in...</p>
        </div>
        <div class="auth-feedback__loader-bar"></div>
      </div>
    </div>
  </body>
</html>
