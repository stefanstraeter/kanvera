<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
    <title>Team</title>

    <link rel="stylesheet" href="./styles/main.css" />

    <script>
      (function () {
        const savedTheme = localStorage.getItem("theme") || "light";
        document.documentElement.setAttribute("data-theme", savedTheme);
      })();
    </script>
    <script type="module" src="./src/main.js"></script>
  </head>
  <body class="l-app">
    <aside class="l-sidebar" id="js-sidebar-anchor"></aside>
    <header class="l-header" id="js-header-anchor"></header>
    <main class="l-content" id="js-content-anchor">
      <div class="team-wrapper l-content-spacer">
        <div class="team-grid" id="js-team-grid"></div>
      </div>
    </main>
    <div id="js-global-modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="modal__content">
        <h2 class="heading-m js-modal-title u-mb-md"></h2>
        <div class="js-modal-body"></div>
      </div>
    </div>
  </body>
</html>
