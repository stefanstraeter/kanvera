<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
    <title>Board - Kanvera</title>

    <link rel="stylesheet" href="./styles/main.css" />

    <script>
      (function () {
        let savedTheme = "light";
        try {
          savedTheme = localStorage.getItem("theme") || "light";
        } catch (error) {
          savedTheme = "light";
        }
        document.documentElement.setAttribute("data-theme", savedTheme);
      })();
    </script>
    <script type="module" src="./src/main.js"></script>
  </head>
  <body class="l-app">
    <aside class="l-sidebar" id="js-sidebar-anchor"></aside>
    <header class="l-header" id="js-header-anchor"></header>

    <main class="l-content" id="jsContentAnchor">
      <div class="board-wrapper">
        <div class="board-search-bar u-mb-lg">
          <div class="search-input-wrapper">
            <input type="text" id="js-search-task" class="input-field board-search-input" placeholder="Search for tasks..." />
            <button id="js-search-reset" class="btn-search-reset" aria-label="Clear search">✕</button>
          </div>
        </div>
        <div class="board-content">
          <div class="board-columns" id="jsBoardColumns"></div>
        </div>
      </div>
    </main>

    <div id="js-global-modal" class="modal" role="dialog" aria-modal="true">
      <div class="modal__content">
        <h2 class="heading-m js-modal-title u-mb-md"></h2>
        <div class="js-modal-body"></div>
      </div>
    </div>
  </body>
</html>
