<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
    <title>Pulse</title>

    <link rel="stylesheet" href="./styles/main.css" />

    <script>
      (function () {
        const savedTheme = localStorage.getItem("theme") || "light";
        document.documentElement.setAttribute("data-theme", savedTheme);
      })();
    </script>
    <script type="module" src="./src/main.js"></script>
  </head>
  <body class="l-app">
    <aside class="l-sidebar" id="js-sidebar-anchor"></aside>
    <header class="l-header" id="js-header-anchor"></header>
    <main class="l-content" id="js-content-anchor">
      <div class="pulse-wrapper l-content-spacer">
        <header class="pulse-header">
          <div class="pulse-greet">
            <h2 class="heading-xl">
              <span id="greetingTitle">Welcome</span><span id="greetingSymbol">!</span>
              <span id="pulseUserName" class="color-main"></span>
            </h2>
            <p class="color-medium-grey" id="greetingSubline">Ready to tackle your tasks?</p>
          </div>
        </header>

        <main class="pulse-content">
          <div class="pulse-row pulse-row--main">
            <div class="pulse-card pulse-card--hero">
              <div class="pulse-stats">
                <span class="pulse-number" id="totalTasks">0</span>
                <span class="pulse-label">Tasks in Board</span>
              </div>
            </div>

            <div class="pulse-card pulse-card--urgent">
              <div class="urgent-info">
                <div class="urgent-badge">
                  <span class="pulse-number" id="urgentCount">0</span>
                </div>
                <span class="pulse-label">Urgent Issue</span>
              </div>
              <div class="pulse-divider"></div>
              <div class="urgent-deadline">
                <span class="deadline-date" id="nextDeadline">Upcoming</span>
                <span class="pulse-label">Deadline</span>
              </div>
            </div>
          </div>

          <div class="pulse-row pulse-row--stats">
            <div class="pulse-card pulse-card--status status-todo">
              <span class="pulse-number" id="countTodo">0</span>
              <span class="pulse-label">Up Next</span>
            </div>
            <div class="pulse-card pulse-card--status status-doing">
              <span class="pulse-number" id="countDoing">0</span>
              <span class="pulse-label">In Progress</span>
            </div>
            <div class="pulse-card pulse-card--status status-await">
              <span class="pulse-number" id="countAwait">0</span>
              <span class="pulse-label">In Review</span>
            </div>
            <div class="pulse-card pulse-card--status status-done">
              <span class="pulse-number" id="countDone">0</span>
              <span class="pulse-label">Done</span>
            </div>
          </div>

          <div class="pulse-row pulse-row--personal">
            <div class="pulse-card pulse-card--gauge">
              <span class="pulse-label">Productivity Gauge</span>
              <div class="pulse-gauge" id="productivityGauge" aria-label="Done task ratio">
                <div class="pulse-gauge__inner">
                  <span class="pulse-number" id="productivityPercent">0%</span>
                  <span class="pulse-label">Done Rate</span>
                </div>
              </div>
            </div>

            <div class="pulse-card pulse-card--busy">
              <div class="busy-header">
                <span class="pulse-label">Who's Busy?</span>
                <span class="busy-subline">Top 3 in progress</span>
              </div>
              <ul class="busy-list" id="busyList">
                <li class="busy-empty">No active workload yet</li>
              </ul>
            </div>
          </div>
        </main>
      </div>
    </main>
  </body>
</html>
